<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricardo Martel | Portfolio</title>
    
    <link rel="stylesheet" href="src/css/base.css">
    <link rel="stylesheet" href="src/css/hero.css">
    <link rel="stylesheet" href="src/css/projects.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
</head>
<body>

    <canvas id="global-bg-canvas"></canvas>

    <!-- Pantalla de Bienvenida con Blob y Dragón -->
    <div id="loader">
        <canvas id="loader-blob-canvas"></canvas>
        <canvas id="dragon-canvas"></canvas>
        
        <div class="loader-content">
            <h1 class="loader-title">EXPLORA EL HORIZONTE</h1>
            <button id="start-btn" class="optic-3d-btn">
                <span class="btn-glow"></span>
                <span class="btn-text">ZAMBULLIRSE</span>
            </button>
        </div>
    </div>

    <main id="smooth-content">
        <section class="hero">
            <div class="hero-content">
                <h1 class="reveal-text">RICARDO<br>MARTEL</h1>
                <p class="reveal-text">Creative Developer & Engineer</p>
            </div>
        </section>

        <section class="featured-work">
            <div class="split-layout">
                <div class="text-side">
                    <span class="tag">PROYECTO DESTACADO</span>
                    <h2 class="fade-out-title">Construyendo interfaces del futuro con rendimiento extremo.</h2>
                    <p class="fade-out-subtitle">Un vistazo al proceso creativo, la interacción 3D y el código detrás de la experiencia.</p>
                </div>
                <div class="image-side-wrapper">
                    <div class="floating-card">
                        <img src="https://images.unsplash.com/photo-1505118380757-91f5f5632de0?q=80&w=2000&auto=format&fit=crop" alt="Proyecto" class="slide-img">
                    </div>
                </div>
            </div>
        </section>

        <section class="contact">
            <div class="contact-inner">
                <h2 class="reveal-text">CONTACTO</h2>
                <a href="mailto:ricardo@email.com" class="reveal-text contact-link">ricardo@email.com</a>
            </div>
            <canvas id="footer-dots-canvas"></canvas>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="src/js/dragon.js"></script>
    <script src="src/js/main.js"></script>
</body>
</html>
