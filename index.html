<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Nombre | Portfolio Surfero</title>
    
    <!-- Conexión al CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Cursor personalizado -->
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    
    <!-- Fondo de estrellas -->
    <canvas id="stars-canvas"></canvas>

    <!-- Añade esto en tu index.html, justo debajo del canvas de estrellas -->
    <canvas id="fluid-canvas"></canvas>


    <!-- Pantalla de entrada -->
    <div id="loader">
        <h1>Entrar al océano</h1>
        <button id="start-btn">Zambullirse</button>
    </div>

    <!-- Contenido -->
    <main id="smooth-content">
        <section class="hero">
            <h1 class="reveal-text">Tu Nombre</h1>
            <p class="reveal-text">Creative Developer & Surfer</p>
        </section>

        <section class="about">
            <h2 class="reveal-text">Bajo la superficie</h2>
            <p class="reveal-text">Soy un creativo enfocado en el desarrollo web y el diseño cinematográfico. Me encanta combinar código y olas.</p>
        </section>

        <section class="featured-work">
            <h2 class="reveal-text">Proyecto Destacado</h2>
            <div class="pinned-image">
                <img src="https://images.unsplash.com/photo-1505118380757-91f5f5632de0?q=80&w=2000&auto=format&fit=crop" alt="Surf">
            </div>
        </section>

        <section class="contact">
            <h2 class="reveal-text">Contacto</h2>
            <a href="mailto:tu@email.com" class="reveal-text">tu@email.com</a>
        </section>
    </main>

    <!-- GSAP y ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    
    <!-- Tu script -->
    <script src="script.js"></script>
</body>
</html>
